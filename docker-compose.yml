services:

  # ============================================================
  # DATABASE
  # ============================================================

  mongodb:
    image: mongo:8
    container_name: ecommerce-mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ecommerce

    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

    networks:
      - backend
      - microservice-ecommerce

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # MongoDB should NOT be exposed to the host
    # in a production-style setup.


  # ============================================================
  # AUTH SERVICE
  # ============================================================

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile

    container_name: auth-service

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5001

      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/authdb?authSource=admin

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - backend
      - microservice-ecommerce

    expose:
      - "5001"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ============================================================
  # PRODUCT SERVICE
  # ============================================================

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile

    container_name: product-service

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5002

      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/productdb?authSource=admin

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - backend
      - microservice-ecommerce

    expose:
      - "5002"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5002/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ============================================================
  # ORDER SERVICE
  # ============================================================

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile

    container_name: order-service

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5003

      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/orderdb?authSource=admin

      AUTH_SERVICE_URL: http://auth-service:5001
      PRODUCT_SERVICE_URL: http://product-service:5002

    depends_on:
      mongodb:
        condition: service_healthy

      auth-service:
        condition: service_healthy

      product-service:
        condition: service_healthy

    networks:
      - backend
      - microservice-ecommerce

    expose:
      - "5003"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5003/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ============================================================
  # API GATEWAY
  # ============================================================

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile

    container_name: ecommerce-api-gateway

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      AUTH_SERVICE_URL: http://auth-service:5001
      PRODUCT_SERVICE_URL: http://product-service:5002
      ORDER_SERVICE_URL: http://order-service:5003

    depends_on:
      auth-service:
        condition: service_healthy

      product-service:
        condition: service_healthy

      order-service:
        condition: service_healthy

    networks:
      - backend
      - microservice-ecommerce

    expose:
      - "5000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ecommerce-frontend

    restart: unless-stopped

    environment:
      NODE_ENV: production

    depends_on:
      api-gateway:
        condition: service_healthy

    networks:
      - microservice-ecommerce

    ports:
      - "80:80"


# ==============================================================
# VOLUMES
# ==============================================================

volumes:

  mongodb_data:
    name: ecommerce_mongodb_data

  mongodb_config:
    name: ecommerce_mongodb_config


# ==============================================================
# NETWORKS
# ==============================================================

networks:

  # Internal service-to-service network
  backend:
    name: ecommerce_backend
    driver: bridge
    internal: true

  # Your existing network
  microservice-ecommerce:
    external: true